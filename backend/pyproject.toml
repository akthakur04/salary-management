[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "salary-management-api"
version = "0.1.0"
description = "ACME salary management: FastAPI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36,<2.2",
    "alembic>=1.14,<2",
    "bcrypt>=4.2,<6",
    "pyjwt>=2.9,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<2.5",
    "pre-commit>=4",
    "commitizen>=4.19,<5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "N",   # pep8 naming
    "SIM", # simplify
    "PT",  # pytest style
    "RUF", # ruff-specific
]

[tool.ruff.lint.isort]
# Explicit, so import order is the same whether ruff runs from backend/ or
# from the repository root (as the pre-commit hook does).
known-first-party = ["app", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests", "migrations", "scripts"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["app"]
branch = true
