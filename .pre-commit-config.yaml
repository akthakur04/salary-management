# Git hooks. Install once per clone: see CONTRIBUTING.md.
#
# Stages:
#   pre-commit  fast checks on staged files: hygiene, ruff lint and format
#   commit-msg  the message follows Conventional Commits
#   pre-push    mypy and pytest on the whole backend
#
# mypy and pytest run on push, not on commit, so a deliberate failing-test
# commit (the first half of a TDD pair) can still be recorded. The pushed
# branch tip must be green. CI runs every check again.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      # Defined locally, not from the commitizen repo, so `-l 72` can be passed:
      # the upstream hook puts the filename right after --commit-msg-file.
      - id: commitizen
        name: commit message (Conventional Commits, first line <= 72)
        entry: cz check --allow-abort -l 72 --commit-msg-file
        language: python
        additional_dependencies: ["commitizen==4.19.3"]
        stages: [commit-msg]
      - id: mypy
        name: mypy (strict, backend)
        entry: bash -c 'cd backend && .venv/bin/mypy'
        language: system
        pass_filenames: false
        files: ^backend/
        stages: [pre-push]
      - id: pytest
        name: pytest (backend)
        entry: bash -c 'cd backend && .venv/bin/pytest'
        language: system
        pass_filenames: false
        files: ^backend/
        stages: [pre-push]
